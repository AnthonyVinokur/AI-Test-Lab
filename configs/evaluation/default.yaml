name: default
version: "1.0"

description: >
  Default AI Test Lab evaluation profile using deterministic
  assertions and optional DeepEval metrics.

engines:
  - name: assertion
    enabled: true

  - name: deepeval
    enabled: false
    metrics:
      - name: answer_relevancy
        enabled: true
        threshold: 0.70

      - name: faithfulness
        enabled: true
        threshold: 0.80

quality_gate:
  enabled: true
  minimum_score: 0.70
  fail_on_engine_error: true
  require_all_engines: false

metadata:
  owner: AI Test Lab
  environment: local