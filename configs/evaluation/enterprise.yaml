# enterprise.yaml
name: enterprise
version: "1.0"

description: >
  Strict enterprise evaluation profile designed for
  high-confidence validation, governance, and audit workflows.

engines:
  - name: assertion
    enabled: true

  - name: deepeval
    enabled: true
    metrics:
      - name: answer_relevancy
        enabled: true
        threshold: 0.90

      - name: faithfulness
        enabled: true
        threshold: 0.90

  - name: ragas
    enabled: false

  - name: trulens
    enabled: false

quality_gate:
  enabled: true
  minimum_score: 0.90
  fail_on_engine_error: true
  require_all_engines: true

metadata:
  owner: AI Test Lab
  environment: enterprise